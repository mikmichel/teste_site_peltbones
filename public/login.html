<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login Administrativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 100px; text-align: center;">
    <h2>Acesso Administrativo</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Digite a senha" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
      <button type="submit" class="button button-primary" style="width: 100%;">Entrar</button>
    </form>
    <p><a href="index.html">Voltar para a loja</a></p>
  </div>
  <script src="login.js"></script>
</body>
</html>
