<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <span>Painel de Controle</span>
    <button id="logoutButton" class="button">Sair</button>
  </header>

  <main class="container">
    <section>
      <h2>Cadastrar Produto</h2>
      <form id="productForm">
        <input type="text" id="name" placeholder="Nome do Produto" required>
        <input type="number" id="price" placeholder="Preço (ex: 59.90)" step="0.01" required>
        <textarea id="description" placeholder="Descrição"></textarea>
        <input type="file" id="imageFile" accept="image/*" required>
        <button type="submit" class="button button-primary">Salvar Produto</button>
      </form>
    </section>

    <hr>

    <section>
      <h2>Alterar Senha</h2>
      <form id="changePasswordForm">
        <input type="password" id="oldPass" placeholder="Senha Atual" required>
        <input type="password" id="newPass" placeholder="Nova Senha" required>
        <button type="submit" class="button">Atualizar Senha</button>
      </form>
    </section>

    <section>
      <h2>Produtos Cadastrados</h2>
      <div id="adminProductGrid" class="product-grid"></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
