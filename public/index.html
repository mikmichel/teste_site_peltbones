<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Catálogo Digital</title>
    <style>
        /* DESIGN PROFISSIONAL - VOCÊ PODE ALTERAR AS CORES AQUI */
        :root {
            --primary-color: #2c3e50; 
            --accent-color: #27ae60; 
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color);
        }

        /* Menu de Navegação */
        nav { 
            background-color: var(--primary-color); 
            padding: 1rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: white;
            position: sticky; top: 0; z-index: 100;
        }
        nav .logo { font-size: 1.5rem; font-weight: bold; }
        nav .menu a { 
            color: white; text-decoration: none; 
            margin-left: 20px; font-weight: 500; 
            padding: 8px 15px; border-radius: 5px;
            transition: background 0.3s;
        }
        nav .menu a:hover { background: rgba(255,255,255,0.2); }
        .admin-link { background: var(--accent-color) !important; }

        /* Conteúdo Principal */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h1 { text-align: center; margin-bottom: 40px; color: var(--primary-color); }

        /* Grid de Produtos */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 30px; 
        }
        .product-card { 
            background: white; 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            transition: transform 0.3s; 
            display: flex; flex-direction: column;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img { 
            width: 100%; height: 200px; 
            object-fit: cover; 
            background-color: #eee; 
        }
        .product-info { padding: 20px; text-align: center; flex-grow: 1; }
        .product-info h3 { margin: 0 0 10px 0; color: var(--primary-color); }
        .product-info .price { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }

        .btn-details { 
            width: 100%; padding: 12px; 
            border: none; background: var(--primary-color); 
            color: white; cursor: pointer; 
            font-weight: bold; transition: 0.3s;
        }
        .btn-details:hover { background: #34495e; }

        /* Modal de Detalhes */
        #product-modal { 
            display:none; position:fixed; top:0; left:0; 
            width:100%; height:100%; background:rgba(0,0,0,0.8); 
            z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal-content { 
            background: white; margin: 5% auto; 
            padding: 0; width: 90%; max-width: 500px; 
            border-radius: 20px; overflow: hidden; 
            text-align: center; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
        
        .modal-content img { width: 100%; height: 300px; object-fit: cover; }
        .modal-body { padding: 25px; }
        .modal-body h2 { margin-top: 0; color: var(--primary-color); }
        .modal-body p { color: #666; line-height: 1.6; }
        .modal-footer { 
            display: flex; gap: 10px; justify-content: center; 
            padding: 20px; background: #f9f9f9; 
        }
        .btn-cart { background: var(--accent-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-close { background: #e74c3c; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🛍️ Minha Loja</div>
        <div class="menu">
            <a href="/">Início</a>
            <a href="/admin.html" class="admin-link">Painel Admin</a>
        </div>
    </nav>

    <div class="container">
        <h1>Nosso Catálogo</h1>
        <div id="product-list" class="grid">Carregando produtos...</div>
    </div>

    <!-- Modal de Detalhes -->
    <div id="product-modal">
        <div class="modal-content">
            <img id="modal-image" src="">
            <div class="modal-body">
                <h2 id="modal-name"></h2>
                <p id="modal-description"></p>
                <p><strong style="font-size:1.2rem">Preço: R$ <span id="modal-price"></span></strong></p>
                <p>📦 Pedido Mínimo: <span id="modal-min"></span> unidades</p>
            </div>
            <div class="modal-footer">
                <button id="add-to-cart-btn" class="btn-cart">Adicionar ao Carrinho</button>
                <button onclick="closeModal()" class="btn-close">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];

        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                if (!response.ok) throw new Error('Erro ao buscar produtos');
                allProducts = await response.json();
                renderProducts();
            } catch (err) {
                document.getElementById('product-list').innerHTML = '❌ Erro ao carregar produtos. Verifique o servidor.';
                console.error(err);
            }
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            if (allProducts.length === 0) {
                list.innerHTML = 'Nenhum produto cadastrado no momento.';
                return;
            }

            allProducts.forEach(product => {
                const div = document.createElement('div');
                div.className = 'product-card';
                // Se a imagem estiver vazia, coloca uma imagem de placeholder
                const imgUrl = product.image || 'https://via.placeholder.com/200';
                
                div.innerHTML = `
                    <img src="${imgUrl}" alt="${product.name}">
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p class="price">R$ ${product.price}</p>
                    </div>
                    <button class="btn-details" onclick="openProduct('${product._id}')">Ver Detalhes</button>
                `;
                list.appendChild(div);
            });
        }

        function openProduct(id) {
            const product = allProducts.find(p => p._id === id);
            if (!product) return;

            document.getElementById('modal-image').src = product.image || 'https://via.placeholder.com/300';
            document.getElementById('modal-name').innerText = product.name;
            document.getElementById('modal-description').innerText = product.description || 'Sem descrição disponível.';
            document.getElementById('modal-price').innerText = product.price;
            document.getElementById('modal-min').innerText = product.minQuantity || 1;
            
            document.getElementById('add-to-cart-btn').onclick = () => addToCart(product);
            document.getElementById('product-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function addToCart(product) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(item => item._id === product._id);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            alert(`✅ ${product.name} adicionado ao carrinho!`);
        }

        fetchProducts();
    </script>
</body>
</html>
