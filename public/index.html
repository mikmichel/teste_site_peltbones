<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Catálogo de Produtos</h1>
    <div id="product-list" class="grid"></div>

    <!-- Modal de Detalhes -->
    <div id="product-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); color:white; text-align:center; padding-top:50px;">
        <div style="background:#fff; color:#000; margin:auto; padding:20px; width:80%; max-width:500px; border-radius:10px;">
            <img id="modal-image" src="" style="width:100%; max-height:300px; object-fit:contain;">
            <h2 id="modal-name"></h2>
            <p id="modal-description"></p>
            <p><strong>Preço:</strong> R$ <span id="modal-price"></span></p>
            <p><strong>Pedido Mínimo:</strong> <span id="modal-min"></span> unidades</p>
            <button id="add-to-cart-btn">Adicionar ao Carrinho</button>
            <button onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
